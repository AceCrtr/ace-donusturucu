<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="google-site-verification" content="R89fBGjXeBEqdvtpUxBO7p6LL5LvhOOgnlaXLJfzoRo" />
    
    <title>Ace Dönüştürücü | Profesyonel PDF Çözümleri</title>
    <meta name="description" content="En hızlı ve şık resimden PDF'e dönüştürme aracı.">
    <meta name="keywords" content="resim pdf dönüştür, jpg pdf çevir, ace dönüştürücü">
    <meta name="author" content="AceCrtr">

    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@300;900&display=swap');
        body { font-family: 'Outfit', sans-serif; background: #050505; color: white; overflow: hidden; }
        .neon-border { border: 1px solid rgba(168, 85, 247, 0.3); box-shadow: 0 0 30px rgba(168, 85, 247, 0.1); }
        .gradient-text { background: linear-gradient(135deg, #a855f7, #ec4899); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .card-bg { background: rgba(15, 15, 15, 0.9); backdrop-filter: blur(15px); }
    </style>
</head>
<body class="min-h-screen flex flex-col items-center justify-center p-4">
    
    <div class="text-center mb-10">
        <h2 class="text-[10px] uppercase tracking-[0.6em] text-gray-500 font-bold mb-3">Ace Sanal Lab</h2>
        <h1 class="text-6xl font-black italic tracking-tighter uppercase">ACE <span class="gradient-text">PDF</span></h1>
    </div>

    <div class="w-full max-w-lg card-bg p-10 rounded-[50px] neon-border transition-all duration-500">
        <div class="mb-8 text-center">
            <h3 class="text-2xl font-bold mb-2 text-white">Hızlı. Şık. <span class="gradient-text">Profesyonel.</span></h3>
            <p class="text-gray-500 text-xs tracking-widest uppercase">Görsel İşleme Motoru v3.0</p>
        </div>

        <input type="file" id="fileInput" class="hidden" onchange="updateInfo(this)">
        <label for="fileInput" class="block p-14 bg-[#0a0a0a] border-2 border-dashed border-gray-800 rounded-[35px] cursor-pointer mb-8 group hover:border-purple-600 transition-all">
            <div class="text-6xl mb-4 group-hover:scale-110 transition-transform duration-300 text-center">⚡</div>
            <span id="fileMsg" class="block text-center text-gray-500 font-medium text-sm tracking-tight">Görseli Buraya Bırakın</span>
        </label>

        <div class="grid grid-cols-2 gap-5 mb-8">
            <div class="bg-[#0c0c0c] p-4 rounded-2xl border border-gray-900 text-center">
                <p class="text-[9px] uppercase text-gray-600 mb-1 font-bold">İşlemci</p>
                <p class="font-bold text-purple-500 text-xs">Render Cloud</p>
            </div>
            <div class="bg-[#0c0c0c] p-4 rounded-2xl border border-gray-900 text-center">
                <p class="text-[9px] uppercase text-gray-600 mb-1 font-bold">Çözünürlük</p>
                <p class="font-bold text-pink-500 text-xs">Ultra HD</p>
            </div>
        </div>

        <button onclick="startProcess()" id="actionBtn" class="w-full bg-white text-black py-5 rounded-[25px] font-black text-xl hover:bg-gradient-to-r hover:from-purple-600 hover:to-pink-600 hover:text-white transition-all active:scale-95 shadow-2xl">
            ŞİMDİ DÖNÜŞTÜR
        </button>
    </div>

    <p class="mt-12 text-gray-800 text-[9px] tracking-[0.5em] uppercase font-black">Design by AceCrtr &copy; 2026</p>

    <script>
        function updateInfo(input) {
            const msg = document.getElementById('fileMsg');
            if(input.files && input.files[0]) {
                msg.innerText = input.files[0].name;
                msg.classList.add('text-purple-500');
            }
        }

        async function startProcess() {
            const btn = document.getElementById('actionBtn');
            const file = document.getElementById('fileInput').files[0];
            
            if(!file) return alert("Hata: Önce bir dosya seçmelisin!");
            
            btn.disabled = true; 
            btn.innerHTML = `<span class="animate-pulse tracking-tighter">VERİ İŞLENİYOR...</span>`;
            
            const formData = new FormData();
            formData.append('file', file);
            
            try {
                const res = await fetch('https://ace-donusturucu.onrender.com/convert', {
                    method: 'POST',
                    body: formData
                });
                
                if(res.ok) {
                    const blob = await res.blob();
                    const url = URL.createObjectURL(blob);
                    const link = document.createElement('a');
                    link.href = url;
                    link.download = "ace_output.pdf";
                    link.click();
                    btn.innerHTML = "İŞLEM BAŞARILI ✅";
                    setTimeout(() => { resetBtn(); }, 3000);
                } else {
                    alert("Sunucu hatası! Lütfen tekrar dene.");
                    resetBtn();
                }
            } catch(err) {
                alert("Sunucuya bağlanılamadı. Render uyanıyor olabilir.");
                resetBtn();
            }
        }

        function resetBtn() {
            const btn = document.getElementById('actionBtn');
            btn.disabled = false;
            btn.innerHTML = "ŞİMDİ DÖNÜŞTÜR";
        }
    </script>
</body>
</html>
