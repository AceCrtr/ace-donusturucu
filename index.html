<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ace Dönüştürücü | Profesyonel Dosya Çevirici</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;700;900&display=swap');
        body { font-family: 'Poppins', sans-serif; background-color: #0f172a; color: white; }
        .ace-card { background: rgba(30, 41, 59, 0.5); border: 1px solid rgba(148, 163, 184, 0.1); backdrop-blur: 10px; }
        .ace-gradient-text { background: linear-gradient(135deg, #60a5fa 0%, #2563eb 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .ace-btn { background: linear-gradient(135deg, #3b82f6 0%, #1d4ed8 100%); transition: all 0.3s ease; }
        .ace-btn:hover { box-shadow: 0 10px 20px -5px rgba(59, 130, 246, 0.5); transform: translateY(-2px); }
    </style>
</head>
<body class="min-h-screen flex flex-col justify-between">

    <nav class="w-full py-6 px-6 md:px-12 flex justify-between items-center border-b border-slate-800/50">
        <div class="flex items-center gap-3">
            <div class="w-10 h-10 ace-btn rounded-xl flex items-center justify-center font-black text-white text-xl shadow-lg">A</div>
            <span class="text-2xl font-black tracking-tight text-white">Ace <span class="ace-gradient-text">Dönüştürücü</span></span>
        </div>
        <div class="text-sm text-slate-500 font-medium tracking-wide uppercase">V1.0 (Beta)</div>
    </nav>

    <main class="flex-grow flex items-center justify-center py-16 px-4">
        <div class="max-w-3xl w-full">
            
            <div class="text-center mb-20 space-y-6">
                <h1 class="text-5xl md:text-6xl font-black tracking-tighter leading-tight">
                    Dosyalarınız İçin <span class="ace-gradient-text italic">As</span> Çözüm.
                </h1>
                <p class="text-slate-400 max-w-xl mx-auto text-lg leading-relaxed font-light">
                    PNG, JPG, WEBP ve daha fazlasını saniyeler içinde, güvenle ve tamamen ücretsiz olarak dönüştürün. Karmaşık ayarlara son.
                </p>
            </div>

            <div class="ace-card p-10 rounded-3xl shadow-2xl relative overflow-hidden">
                <div class="relative z-10 space-y-12">
                    
                    <div class="group border-2 border-dashed border-slate-700 hover:border-blue-500 rounded-2xl p-16 text-center transition-all cursor-pointer bg-slate-900/50">
                        <input type="file" id="fileInput" class="hidden">
                        <label for="fileInput" class="cursor-pointer block">
                            <div class="text-7xl mb-8 group-hover:scale-110 transition-transform duration-300">📁</div>
                            <span class="text-2xl font-bold block mb-2 text-white">Dosyanızı Buraya Bırakın</span>
                            <p class="text-base text-slate-500 font-medium">Veya seçmek için tıklayın</p>
                        </label>
                    </div>

                    <div class="grid grid-cols-1 md:grid-cols-2 gap-8">
                        <div class="space-y-3">
                            <label class="text-sm font-semibold text-slate-400 uppercase ml-1 tracking-wider">HEDEF FORMAT</label>
                            <select id="convertType" class="w-full bg-slate-900/80 border border-slate-700 rounded-xl p-5 text-lg text-white outline-none focus:ring-2 focus:ring-blue-500 transition-all font-medium appearance-none">
                                <option value="pdf">Görseli PDF Yap</option>
                                <option value="jpg">PNG'yi JPG Yap</option>
                                <option value="webp">WEBP'ye Dönüştür</option>
                            </select>
                        </div>
                        <div class="space-y-3">
                            <label class="text-sm font-semibold text-slate-400 uppercase ml-1 tracking-wider">KALİTE AYARI</label>
                            <select class="w-full bg-slate-900/80 border border-slate-700 rounded-xl p-5 text-lg text-white outline-none focus:ring-2 focus:ring-blue-500 transition-all font-medium appearance-none">
                                <option>Yüksek Kalite</option>
                                <option>Standart</option>
                                <option>Sıkıştır (Küçük Boyut)</option>
                            </select>
                        </div>
                    </div>

                    <button onclick="startConversion()" id="actionBtn" class="w-full ace-btn py-6 rounded-2xl font-black text-2xl tracking-tight text-white active:scale-[0.98]">
                        İŞLEMİ BAŞLAT
                    </button>
                </div>
                
                <div class="absolute -bottom-20 -left-20 w-64 h-64 ace-btn rounded-full opacity-10 blur-3xl"></div>
                <div class="absolute -top-20 -right-20 w-64 h-64 ace-btn rounded-full opacity-10 blur-3xl"></div>
            </div>

            <div class="mt-16 w-full py-10 bg-slate-900/50 border border-slate-800 rounded-2xl text-center">
                <span class="text-sm text-slate-600 font-bold uppercase tracking-[0.3em]">Sponsorlu Bağlantı</span>
            </div>
        </div>
    </main>

    <footer class="w-full text-center py-10 border-t border-slate-800/50 px-6 space-y-2">
        <p class="text-slate-500 text-sm font-medium">
            &copy; 2026 Ace Dönüştürücü. Tüm hakları saklıdır.
        </p>
        <p class="text-xs text-slate-700 font-light tracking-wide">
            Minimalizm ve Güç: Bir Sanalcı Projesi
        </p>
    </footer>

    <script>
        function startConversion() {
            const btn = document.getElementById('actionBtn');
            const file = document.getElementById('fileInput').files[0];
            
            if(!file) {
                alert("Lütfen önce bir dosya seç 'As'lan parçası!");
                return;
            }

            btn.innerHTML = "İŞLENİYOR...";
            btn.disabled = true;

            // Backend bağlantısı buraya gelecek
            setTimeout(() => {
                alert("Tasarım harika oldu! Şimdi Python Backend sunucumuzu kuralım, Ace!");
                btn.innerHTML = "İŞLEMİ BAŞLAT";
                btn.disabled = false;
            }, 1800);
        }
    </script>
</body>
</html>
